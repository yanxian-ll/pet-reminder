name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: release-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: release-macos-aarch64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: release-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application bundle
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Prepare Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/deskpet-rest-reminder_windows_x64.exe"

      - name: Prepare Apple Silicon installer
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/deskpet-rest-reminder_aarch64.dmg

      - name: Prepare Intel macOS installer
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/deskpet-rest-reminder_x64.dmg

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
