name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: release-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: release-macos-aarch64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: release-macos-x64
          - name: Ubuntu x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: release-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${APP_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application bundle
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Prepare Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName "release-assets/Pet-Reminder_${{ github.ref_name }}_windows-x64.exe"

      - name: Prepare Apple Silicon installer
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir -p release-assets
          dmg="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "release-assets/Pet-Reminder_${{ github.ref_name }}_macos-arm64.dmg"

      - name: Prepare Intel macOS installer
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          mkdir -p release-assets
          dmg="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "release-assets/Pet-Reminder_${{ github.ref_name }}_macos-x64.dmg"

      - name: Prepare Ubuntu installers
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p release-assets
          deb="$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -type f -name '*.deb' -print -quit)"
          appimage="$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          cp "$deb" "release-assets/Pet-Reminder_${{ github.ref_name }}_linux-amd64.deb"
          cp "$appimage" "release-assets/Pet-Reminder_${{ github.ref_name }}_linux-x86_64.AppImage"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pet Reminder ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
