name: Build Ubuntu packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build deb and AppImage packages
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles deb,appimage
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ubuntu-x86_64-[bundle]

      - name: Validate Debian package metadata
        shell: bash
        run: |
          DEB_FILE="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          test -n "$DEB_FILE"
          PACKAGE_NAME="$(dpkg-deb --field "$DEB_FILE" Package)"
          PACKAGE_VERSION="$(dpkg-deb --field "$DEB_FILE" Version)"
          echo "Debian package name: $PACKAGE_NAME"
          echo "Debian package version: $PACKAGE_VERSION"
          test "$PACKAGE_NAME" = "pet-reminder"
          test "$PACKAGE_VERSION" = "0.2.1"
          [[ "$PACKAGE_NAME" =~ ^[a-z0-9][a-z0-9+.-]+$ ]]
          dpkg-deb --info "$DEB_FILE"
